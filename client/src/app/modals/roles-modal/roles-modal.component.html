<div class="modal-header">
  <h4 class="modal-title">Edit roles for {{user.username}}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="bsModalRef.hide()"></button>
</div>
<div class="modal-body">
  <form #rolesForm="ngForm" id="rolesForm">
    @for (role of roles; track role) {
      <div class="form-check">
        <input type="checkbox"
          class="form-check-input"
          [checked]="role.checked"
          value="role.name"
          (change)="role.checked = !role.checked"
          [disabled]="role.name === 'Admin' && user.username === 'admin'"
          >
          <label>{{role.name}}</label>
        </div>
      }
    </form>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="bsModalRef.hide()">Cancel</button>
    <button type="button" class="btn btn-success" (click)="updateRoles()">Submit</button>
  </div>
